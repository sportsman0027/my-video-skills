    success_criterion: In the next multipart scripted video assembly after install, the pre-assembly record shows measured narration pace and a picture to script scene mapping, the delivered total equals the narration total with no cut or sped narration, and the delivery includes an editing map listing slow holds and any topic offsets. If no such assembly occurs in the window, the result is inconclusive rather than a failure.
