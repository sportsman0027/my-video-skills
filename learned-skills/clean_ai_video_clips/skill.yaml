  rationale: 'The same failure recurred across two projects. In Building Earth 2.0 the 2026-10-28 delivery listed 13 shots for rebuild for baked NASA, ESA, and Roscosmos logos, readable labels and captions, a Mars to Earth morph, a wrong Mars to Earth size relation, and a duplicate planet, plus 2 shots for edit fixes, out of 72 shots totalling 725 seconds. The countermeasures that worked in the evidence were text free generation with all labels added by hand in post, close detail framing that produced the first clean astronaut shot, distant framing with no text, saving the old version and replacing it only when the new version was clearly better, and disclosing the exact flaw list with delivery. No existing skill covers this method: skill_search for AI video generation and frame verification returned only avatar dance videos, translation, spoken audio, and podcast generation. The deterministic repeated_handoff_suppression candidates were rejected because they concern the loop''s own trigger cadence, which no managed skill can change, and the only managed learned file is already retired, so no consolidation is required.'
